<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="stylesheet" href="asset/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo-wrapper">
      <img src="asset/img/tpmfinal1.webp" alt="Logo Teras Putro Mapan">
    </div>

    <h1 class="auth-title">Log in</h1>

    <div id="alertBox" class="auth-alert"></div>

    <form id="loginForm">
      <div class="auth-form-group">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="tes@email.com" required autocomplete="email">
      </div>

      <div class="auth-form-group">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn" class="auth-btn">Masuk</button>
    </form>

    <div class="auth-footer-link">
      Belum punya akun? <a href="register.html">Daftar</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pxtuvkpyyzujzeiywour.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_47_TljLIRHGE4jgMfdObVg_l47vt2wH';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Memproses...';

      try {
        // 1. Login dengan Email & Password ke Supabase Auth
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (authError) {
          throw new Error('Email atau password salah, atau email belum diverifikasi.');
        }

        // 2. Ambil Role dari tabel public.profiles
        const { data: profileData, error: profileError } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', authData.user.id)
          .single();

        if (profileError || !profileData) {
          throw new Error('Profil pengguna tidak ditemukan.');
        }

        // 3. Redirect sesuai Role
        if (profileData.role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'order-menu.html';
        }

      } catch (err) {
        showAlert(err.message, 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
      }
    });
  </script>

</body>
</html>
