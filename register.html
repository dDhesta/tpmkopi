<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Teras Putro Mapan</title>
  <link rel="stylesheet" href="../asset/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo-wrapper">
      <img src="../asset/img/tpmfinal1.webp" alt="Logo Teras Putro Mapan">
    </div>

    <h1 class="auth-title">Register</h1>

    <div id="alertBox" class="auth-alert"></div>

    <form id="registerForm">
      <div class="auth-form-group">
        <label for="username">Username :</label>
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
      </div>

      <div class="auth-form-group">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com" required autocomplete="email">
      </div>

      <div class="auth-form-group">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" minlength="6" required autocomplete="new-password">
      </div>

      <button type="submit" id="registerBtn" class="auth-btn">Register</button>
    </form>

    <div class="auth-footer-link">
      Sudah punya akun? <a href="index.html">Log in</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pxtuvkpyyzujzeiywour.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_47_TljLIRHGE4jgMfdObVg_l47vt2wH';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      registerBtn.disabled = true;
      registerBtn.textContent = 'Mendaftarkan...';

      try {
        // Mendaftarkan user ke Supabase Auth sekaligus mengirim metadata username
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              username: username,
              role: 'customer' // Default role pendaftar baru adalah customer
            }
          }
        });

        if (error) {
          throw new Error(error.message);
        }

        // Cek apakah Supabase membutuhkan konfirmasi email atau langsung aktif
        if (data.user && data.session) {
          showAlert('Registrasi berhasil! Mengalihkan ke halaman pemesanan...', 'success');
          setTimeout(() => {
            window.location.href = 'order-menu.html';
          }, 1500);
        } else {
          showAlert('Registrasi berhasil! Silakan cek kotak masuk email kamu untuk verifikasi sebelum login.', 'success');
          registerForm.reset();
          registerBtn.disabled = false;
          registerBtn.textContent = 'Register';
        }

      } catch (err) {
        showAlert('Gagal mendaftar: ' + err.message, 'error');
        registerBtn.disabled = false;
        registerBtn.textContent = 'Register';
      }
    });
  </script>

</body>
</html>
